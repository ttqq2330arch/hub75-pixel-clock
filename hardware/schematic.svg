<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 880" font-family="Consolas, Menlo, monospace">
<rect width="1040" height="880" fill="#ffffff"/>
<text x="20" y="32" font-size="20" font-weight="bold" fill="#222">ESP32-S3 × HUB75 像素时钟驱动板 — 原理图 v0.1（手焊参考）</text>
<text x="20" y="54" font-size="13" fill="#666">场景：消费电子/室内桌面摆件，无车载保护链。供电：单路 5V/5A 外置电源。HUB75 仅走信号+GND，屏 VH4 由同一电源单独供。</text>

<!-- ===== 电源轨 ===== -->
<line x1="120" y1="120" x2="880" y2="120" stroke="#d32f2f" stroke-width="3"/>
<text x="600" y="113" font-size="13" fill="#d32f2f">5V</text>
<line x1="120" y1="210" x2="880" y2="210" stroke="#1565c0" stroke-width="3"/>
<text x="600" y="203" font-size="13" fill="#1565c0">3V3</text>
<line x1="120" y1="800" x2="920" y2="800" stroke="#2e7d32" stroke-width="3"/>
<text x="120" y="820" font-size="13" fill="#2e7d32">GND</text>

<!-- ===== 5V 输入（螺丝端子）===== -->
<rect x="40" y="95" width="70" height="50" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
<text x="50" y="90" font-size="12" fill="#333">J0 5V IN</text>
<circle cx="62" cy="110" r="4" fill="#fff" stroke="#333"/><text x="70" y="114" font-size="11" fill="#d32f2f">5V</text>
<circle cx="62" cy="130" r="4" fill="#fff" stroke="#333"/><text x="70" y="134" font-size="11" fill="#2e7d32">GND</text>
<line x1="62" y1="110" x2="150" y2="110" stroke="#d32f2f" stroke-width="2"/>
<line x1="62" y1="130" x2="120" y2="130" stroke="#2e7d32" stroke-width="2"/><line x1="120" y1="130" x2="120" y2="800" stroke="#2e7d32" stroke-width="2"/>

<!-- D1 OR 二极管 -->
<circle cx="150" cy="120" r="3" fill="#d32f2f"/><line x1="150" y1="110" x2="150" y2="120" stroke="#d32f2f" stroke-width="2"/>
<line x1="150" y1="120" x2="200" y2="120" stroke="#d32f2f" stroke-width="2"/>
<text x="158" y="116" font-size="10" fill="#d32f2f">D1 SS14</text>

<!-- 大电容 -->
<rect x="320" y="135" width="26" height="40" fill="#eef" stroke="#333"/><line x1="333" y1="135" x2="333" y2="155" stroke="#333"/><line x1="333" y1="175" x2="333" y2="195" stroke="#333"/><text x="300" y="130" font-size="10" fill="#333">C1 1000µF</text>
<line x1="333" y1="135" x2="333" y2="120" stroke="#d32f2f" stroke-width="2"/><line x1="333" y1="195" x2="333" y2="800" stroke="#2e7d32" stroke-width="2"/>
<rect x="380" y="135" width="20" height="30" fill="#eef" stroke="#333"/><text x="368" y="130" font-size="10" fill="#333">C2 0.1µF</text>
<line x1="390" y1="135" x2="390" y2="120" stroke="#d32f2f" stroke-width="2"/><line x1="390" y1="165" x2="390" y2="800" stroke="#2e7d32" stroke-width="2"/>

<!-- LDO AMS1117-3.3 -->
<rect x="190" y="185" width="80" height="55" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
<text x="200" y="182" font-size="12" fill="#333">U1 AMS1117-3.3</text>
<text x="198" y="210" font-size="10" fill="#333">IN</text><line x1="200" y1="210" x2="200" y2="120" stroke="#d32f2f" stroke-width="2"/>
<text x="198" y="232" font-size="10" fill="#1565c0">OUT</text><line x1="200" y1="232" x2="200" y2="210" stroke="#1565c0" stroke-width="2"/>
<text x="252" y="218" font-size="10" fill="#2e7d32">GND</text><line x1="252" y1="213" x2="252" y2="800" stroke="#2e7d32" stroke-width="2"/>

<!-- 3V3 去耦 -->
<rect x="470" y="225" width="26" height="36" fill="#eef" stroke="#333"/><text x="452" y="220" font-size="10" fill="#333">C3 10µF</text>
<line x1="483" y1="225" x2="483" y2="210" stroke="#1565c0" stroke-width="2"/><line x1="483" y1="261" x2="483" y2="800" stroke="#2e7d32" stroke-width="2"/>
<rect x="530" y="225" width="20" height="26" fill="#eef" stroke="#333"/><text x="518" y="220" font-size="10" fill="#333">C4 100n</text>
<line x1="540" y1="225" x2="540" y2="210" stroke="#1565c0" stroke-width="2"/><line x1="540" y1="251" x2="540" y2="800" stroke="#2e7d32" stroke-width="2"/>

<!-- ===== USB-C ===== -->
<rect x="800" y="55" width="95" height="55" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
<text x="808" y="52" font-size="12" fill="#333">J1 USB-C</text>
<text x="808" y="78" font-size="10" fill="#d32f2f">VBUS</text><line x1="820" y1="78" x2="790" y2="78" stroke="#d32f2f" stroke-width="2"/><line x1="790" y1="78" x2="790" y2="120" stroke="#d32f2f" stroke-width="2"/><circle cx="790" cy="120" r="3" fill="#d32f2f"/>
<text x="808" y="98" font-size="10" fill="#444">D-/D+</text>
<line x1="820" y1="92" x2="700" y2="92" stroke="#444" stroke-width="1.5"/><line x1="700" y1="92" x2="700" y2="560" stroke="#444" stroke-width="1.5"/><text x="640" y="560" font-size="10" fill="#444">→GPIO19</text>
<line x1="835" y1="98" x2="720" y2="98" stroke="#444" stroke-width="1.5"/><line x1="720" y1="98" x2="720" y2="575" stroke="#444" stroke-width="1.5"/><text x="660" y="578" font-size="10" fill="#444">→GPIO20</text>
<text x="860" y="72" font-size="10" fill="#444">CC1/2</text>
<line x1="865" y1="70" x2="865" y2="110" stroke="#444"/><line x1="865" y1="110" x2="900" y2="110" stroke="#444"/><text x="890" y="108" font-size="9" fill="#333">5.1k</text><line x1="900" y1="110" x2="900" y2="800" stroke="#2e7d32" stroke-width="2"/>
<line x1="815" y1="105" x2="815" y2="800" stroke="#2e7d32" stroke-width="2"/>

<!-- ===== ESP32-S3 模块 ===== -->
<rect x="380" y="360" width="280" height="200" fill="#fff8e1" stroke="#333" stroke-width="2.5"/>
<text x="390" y="382" font-size="13" font-weight="bold" fill="#333">U2 ESP32-S3-WROOM-1 (N16R8)</text>
<text x="390" y="402" font-size="11" fill="#555">16MB Flash + 8MB PSRAM</text>

<!-- 3V3 进模块 -->
<line x1="300" y1="210" x2="300" y2="430" stroke="#1565c0" stroke-width="2"/><line x1="300" y1="430" x2="380" y2="430" stroke="#1565c0" stroke-width="2"/>
<text x="310" y="425" font-size="10" fill="#1565c0">3V3×多</text>
<!-- GND 进模块 -->
<line x1="320" y1="800" x2="320" y2="470" stroke="#2e7d32" stroke-width="2"/><line x1="320" y1="470" x2="380" y2="470" stroke="#2e7d32" stroke-width="2"/>
<text x="330" y="465" font-size="10" fill="#2e7d32">GND×多</text>

<!-- strapping 上拉 -->
<line x1="380" y1="500" x2="330" y2="500" stroke="#444"/><text x="250" y="504" font-size="10" fill="#444">GPIO45 →10k→3V3</text>
<line x1="330" y1="500" x2="300" y2="500" stroke="#1565c0"/>
<line x1="380" y1="520" x2="330" y2="520" stroke="#444"/><text x="250" y="524" font-size="10" fill="#444">GPIO46 →10k→GND</text>
<line x1="330" y1="520" x2="320" y2="520" stroke="#2e7d32"/>

<!-- HUB75 信号束 -->
<line x1="460" y1="560" x2="460" y2="690" stroke="#444" stroke-width="2"/>
<line x1="500" y1="560" x2="500" y2="690" stroke="#444" stroke-width="2"/>
<line x1="540" y1="560" x2="540" y2="690" stroke="#444" stroke-width="2"/>
<text x="430" y="630" font-size="10" fill="#444">HUB75 13线 → J2</text>
<text x="560" y="630" font-size="9" fill="#888">R1G1B1/R2G2B2/A-D-E/CLK/LAT/OE</text>

<!-- ===== HUB75 16P ===== -->
<rect x="380" y="690" width="280" height="70" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
<text x="390" y="708" font-size="12" fill="#333">J2 HUB75 (2×8, 2.54mm)</text>
<text x="390" y="730" font-size="9" fill="#333">1R1 2G1 3B1 4GND 5R2 6G2 7B2 8GND</text>
<text x="390" y="746" font-size="9" fill="#333">9A 10B 11C 12D 13E 14CLK 15LAT 16OE</text>

<!-- ===== 按键 / LED / 外设（右侧）===== -->
<!-- BOOT -->
<rect x="760" y="360" width="60" height="34" fill="#f5f5f5" stroke="#333"/><text x="768" y="382" font-size="11" fill="#333">SW1</text>
<line x1="760" y1="377" x2="700" y2="377" stroke="#444"/><line x1="700" y1="377" x2="700" y2="540" stroke="#444"/><text x="660" y="540" font-size="10" fill="#444">→GPIO0</text>
<line x1="820" y1="377" x2="880" y2="377" stroke="#1565c0"/><line x1="880" y1="377" x2="880" y2="350" stroke="#1565c0"/><text x="885" y="354" font-size="9" fill="#1565c0">10k→3V3</text>
<line x1="820" y1="377" x2="900" y2="377" stroke="#2e7d32"/><line x1="900" y1="377" x2="900" y2="800" stroke="#2e7d32" stroke-width="2"/>
<!-- EN -->
<rect x="760" y="440" width="60" height="34" fill="#f5f5f5" stroke="#333"/><text x="768" y="462" font-size="11" fill="#333">SW2</text>
<line x1="760" y1="457" x2="700" y2="457" stroke="#444"/><line x1="700" y1="457" x2="700" y2="560" stroke="#444"/><text x="660" y="560" font-size="10" fill="#444">→EN</text>
<line x1="820" y1="457" x2="880" y2="457" stroke="#1565c0"/><line x1="880" y1="457" x2="880" y2="420" stroke="#1565c0"/><text x="885" y="424" font-size="9" fill="#1565c0">10k→3V3</text>
<line x1="820" y1="457" x2="900" y2="457" stroke="#2e7d32"/><line x1="900" y1="457" x2="900" y2="800" stroke="#2e7d32" stroke-width="2"/>
<line x1="700" y1="560" x2="700" y2="575" stroke="#444"/>
<!-- LED -->
<circle cx="790" cy="540" r="9" fill="#fff" stroke="#333"/><text x="804" y="544" font-size="10" fill="#333">LED</text>
<line x1="760" y1="540" x2="700" y2="540" stroke="#444"/><text x="640" y="544" font-size="10" fill="#444">←GPIO2</text>
<line x1="790" y1="549" x2="790" y2="800" stroke="#2e7d32" stroke-width="2"/>
<text x="806" y="560" font-size="9" fill="#888">串330Ω</text>
<!-- I2C SHT30 -->
<rect x="760" y="610" width="110" height="40" fill="#f5f5f5" stroke="#333"/><text x="768" y="632" font-size="10" fill="#333">J3 SHT30 (可选)</text>
<line x1="760" y1="620" x2="700" y2="620" stroke="#444"/><text x="640" y="624" font-size="10" fill="#444">←GPIO41 SDA</text>
<line x1="760" y1="640" x2="700" y2="640" stroke="#444"/><text x="640" y="644" font-size="10" fill="#444">←GPIO42 SCL</text>
<!-- BUZ -->
<rect x="180" y="640" width="120" height="34" fill="#f5f5f5" stroke="#333"/><text x="188" y="662" font-size="10" fill="#333">BUZ 蜂鸣器(可选)</text>
<line x1="300" y1="657" x2="700" y2="657" stroke="#444"/><text x="640" y="661" font-size="10" fill="#444">←GPIO14</text>

<text x="20" y="860" font-size="11" fill="#c00">⚠ 上电前必须：用万用表蜂鸣档确认 5V 与 GND 不短路；HUB75 排线方向对面板丝印 IN，插反可能烧屏。</text>
</svg>
