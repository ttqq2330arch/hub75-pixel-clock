<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body{margin:0;background:#0b0d12;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .phone{width:380px;height:760px;background:#0c0f17;border:1px solid #2a3240;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 20px 70px rgba(0,0,0,.6)}
  .statusbar{height:26px;background:#141925;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#9aa5b6;font-size:12px}
  .content{position:absolute;top:26px;left:0;right:0;bottom:62px;overflow:auto}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #27303f;background:rgba(10,13,20,.6)}
  .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3df0ff,#ff4fd8);display:grid;place-items:center;font-weight:800;color:#0c0f17;font-size:12px}
  header h1{font-size:14px;margin:0;color:#e8ecf2}
  header p{font-size:10px;margin:0;color:#8b97a8}
  .panel{background:linear-gradient(180deg,#141925,#1b2230);border:1px solid #27303f;border-radius:12px;padding:12px;margin:10px}
  .panel h2{font-size:12px;margin:0 0 8px;color:#3df0ff;font-weight:700}
  .row{margin-bottom:8px}
  .lab{font-size:10px;color:#8b97a8;margin-bottom:4px;display:block}
  .drop{border:1.5px dashed #2a3240;border-radius:10px;padding:14px 8px;text-align:center;color:#8b97a8;font-size:11px;background:#0e1320}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .box{background:#0e1320;border:1px solid #2a3240;border-radius:7px;padding:6px 8px;font-size:11px;color:#e8ecf2}
  .pill{display:inline-block;font-size:10px;padding:4px 10px;border-radius:16px;border:1px solid #2a3240;background:#0e1320;color:#3df0ff;margin-top:4px}
  .btn{width:100%;background:linear-gradient(135deg,#3df0ff,#19b6ff);color:#05121a;border:none;border-radius:9px;padding:10px;font-size:12px;font-weight:700;margin-top:6px}
  .note{font-size:10px;color:#8b97a8;background:#0e1320;border-left:2px solid #3df0ff;padding:6px 8px;border-radius:0 8px 8px 0;margin-top:6px;line-height:1.5}
  .preview{width:100%;height:90px;background:#05070c;border-radius:10px;display:grid;place-items:center;margin-top:6px}
  .px{width:120px;height:60px;background:
    repeating-linear-gradient(0deg,#3df0ff 0 6px,#0c2230 6px 12px),
    repeating-linear-gradient(90deg,#3df0ff 0 6px,transparent 6px 12px);
    background-blend-mode:overlay;border-radius:4px;box-shadow:0 0 14px rgba(61,240,255,.4)}
  .nav{position:absolute;bottom:0;left:0;right:0;height:62px;background:#151922;border-top:1px solid #2a3240;display:flex}
  .nav .it{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5e6878;font-size:10px;gap:3px}
  .nav .it.on{color:#3df0ff}
  .nav .it .ic{font-size:18px}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>像素时钟 · 工坊</span><span>Wi-Fi</span></div>
  <div class="content">
    <header>
      <div class="logo">H75</div>
      <div><h1>HUB75 像素图片生成器</h1><p>已嵌入 APP「工坊」标签页</p></div>
    </header>

    <div class="panel">
      <h2>源图</h2>
      <div class="drop">把图片<b>拖到这里</b>，或<b>点击选择</b><br><span style="font-size:10px">支持 PNG/JPG/GIF，也可粘贴截图</span></div>
      <div class="preview"><div class="px"></div></div>
    </div>

    <div class="panel">
      <h2>面板规格</h2>
      <div class="grid2">
        <div class="box">宽 W<br>64</div>
        <div class="box">高 H<br>64</div>
      </div>
      <div class="box" style="margin-top:6px">扫描 1/32 · 保持比例留黑边</div>
    </div>

    <div class="panel">
      <h2>表盘直推 <span style="color:#8b97a8;font-weight:400">像素时钟 · ESP32-S3</span></h2>
      <div class="note">把处理好的帧按 64×64 RGB565 小端直接推送到设备，本地循环播放。</div>
      <div class="row" style="margin-top:8px"><span class="lab">目标设备 <span style="color:#3df0ff">(自动取 APP 已连接的板子)</span></span>
        <div class="box">http://192.168.1.46</div></div>
      <div class="grid2">
        <div class="box">目标：立即播放</div>
        <div class="box">帧率 10fps</div>
      </div>
      <button class="btn">⬆ 推送到表盘</button>
      <button class="btn" style="background:transparent;color:#9aa5b6;border:1px solid #2a3240">🔌 测试连接 · 🖥️ 打开设备网页</button>
    </div>
  </div>

  <div class="nav">
    <div class="it"><div class="ic">▶</div>控制台</div>
    <div class="it"><div class="ic">＋</div>表盘库</div>
    <div class="it on"><div class="ic">✨</div>工坊</div>
    <div class="it"><div class="ic">🔍</div>设置</div>
  </div>
</div>
</body>
</html>
