; ============================================================
;  HUB75 Pixel Clock — ESP32-S3 + 64x64 HUB75 RGB Matrix
;  Platform: espressif32 6.5.0 (Arduino core 2.0.17)
;  - mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA 支持 ESP32-S3（原 tidbyt fork 在 PIO  registry 无此名，必须用原作者的）
;  - BLEDevice 经典 API 在 core 2.0.x 最稳，不要升 3.x（API 大改）
; ============================================================
[platformio]
; 强制全局缓存/包目录落在 F 盘，绝不写 C 盘（遵守用户死命令）
; 重要：路径不能含中文！ESP32 的 GCC 工具链读不懂 -I 里的 CJK 路径，
; 会导致 WiFi.h / BLEDevice.h 等框架库“找不到”。所以用纯 ASCII 的 F:/pio。
core_dir = F:/pio
; 构建目录（.pio 里的 libdeps 也会被加进 -I）同样必须 ASCII，否则 HUB75 库也挂
build_dir = F:/hub75-build

[env:esp32-s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1-n16r8         ; 自定义 N16R8 板型（见 boards/，带 8MB OPI PSRAM + 16MB Flash）
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 64x64 双缓冲位平面约 40-70KB DMA buffer，必须落在内部 SRAM。
; N16R8 的 8MB PSRAM 注意：HUB75 库 DMA 不能用 PSRAM（带宽 ~10MHz
; 会拖垮刷新率），PSRAM 保持默认开启但不参与显示缓冲，留给后续扩展。
; N16R8 = 16MB Flash，配 16MB 分区表（OTA A/B + 表盘存储区 2MB，见 csv）
board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB        ; N16R8 = 16MB Flash，匹配上面的分区表
board_build.f_flash = 80000000L
board_build.flash_mode = qio
; PSRAM 类型不要用 board_build.psram（该键 esppressif32 平台不识别，会被静默忽略）！
; 正确做法：自定义板型 boards/esp32-s3-devkitc-1-n16r8.json 里设
;   arduino.memory_type = "qio_opi"  + extra_flags "-DBOARD_HAS_PSRAM"
; 之前用无 PSRAM 的 N8 板型 + 无效 psram 键，PSRAM 从未启用 → HUB75 DMA 缓冲申请失败 → bootloop。

; LDF 深度模式：把 Arduino-ESP32 框架自带的 WiFi/BLE/Preferences 等库
; 也链进构建，否则 <WiFi.h> / <BLEDevice.h> 会报 “No such file”
lib_ldf_mode = deep

build_flags =
  -D CORE_DEBUG_LEVEL=2
  -D ARDUINO_RUNNING_CORE=1          ; WiFi/BLE 跑在 core 0，渲染在 core 1
  -D CONFIG_ARDUHAL_LOG_COLORS=0

lib_deps =
  https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git
  adafruit/Adafruit GFX Library @ ^1.11.9
